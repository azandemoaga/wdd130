<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dry Oar Rafting</title>
    <meta name="description"
      content="Get in touch with Dry Oar Rafting. Use our contact form, find our location on the map, or meet our expert river team.">
    <meta name="Azande Moaga" content="Azande Moaga">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-dryoarlogo.png" alt="Dry Oar Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-details">
            <h1>Dry Oar</h1>
            <p>123 Main River Street<br>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@dryoar.com</p>
        </section>

        <section class="contact-grid">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6433387.744502167!2d-126.31015728102597!3d38.06333316688739!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809affcf4c9e4a63%3A0xcf652ab08a2309a0!2sRaft%20California%20-%20American%20River%20Rafting!5e0!3m2!1sen!2sza!4v1770546622134!5m2!1sen!2sza"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form action="#" method="post">
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Full Name">
                </div>
                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com">
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general"> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website
                        Suggestion</label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/Zach-Collier-Salmon.jpg" alt="Manager Profile">
                    <figcaption><strong>Manager</strong><br>Jami Stone</figcaption>
                </figure>
                <figure>
                    <img src="images/Thumbnail_Mdu_2987_319e616b7a560b05c10b5e3af42fab30.jpg"
                      alt="Head Guide Profile">
                    <figcaption><strong>Head Guide</strong><br>Mdu Simons</figcaption>
                </figure>
                <figure>
                    <img src="images/source-to-sea-kajak-team-bernie-steidl.jpg"
                      alt="Support Specialist Profile">
                    <figcaption><strong>Support Specialist</strong><br>Erin Doe</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Dry Oar | Azande Moaga</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook_3536394.png" alt="Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin_3536505.png" alt="LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram_3955027.png" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
